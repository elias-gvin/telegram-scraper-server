[project]
name = "telegram-scraper-api"
version = "0.3.0"
description = "Local Telegram archive (SQLite + media) with an HTTP API"
authors = [{ name = "Oleksandr Detilie", email = "al.detillier@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "telethon==1.46.0",
    "qrcode>=8.2.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pyyaml>=6.0.0",
    "click>=8.0.0",
]

[project.scripts]
tgsc-server = "telegram_scraper.server:main"
tgsc-auth = "telegram_scraper.authenticate:main"

[dependency-groups]
dev = [
    "ruff>=0.14.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "telegram_scraper"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header", "fastapi.Body"]
